name: Publish Orcinal
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
concurrency:
  group: sole-radar-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: published
      - uses: actions/checkout@v4
        with:
          ref: source
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Seed the last published catalog
        run: |
          mkdir -p source/data
          cp published/api/catalog.json source/data/catalog.json
          # A design-only push must preserve the newer catalog from scheduled scans.
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from urllib.request import urlopen
          path = Path("source/data/catalog.json")
          stored = json.loads(path.read_bytes())
          try:
              with urlopen("https://veinpsycoo.github.io/sole-radar/api/catalog.json", timeout=30) as response:
                  raw = response.read(64 * 1024 * 1024 + 1)
              if len(raw) > 64 * 1024 * 1024:
                  raise ValueError("unexpected catalog size")
              live = json.loads(raw)
              if (live["products"] and len(live["sources"]) == len(stored["sources"])
                      and datetime.fromisoformat(live["generatedAt"]) > datetime.fromisoformat(stored["generatedAt"])):
                  path.write_bytes(raw)
                  print("Using the newer public catalog", live["generatedAt"])
          except (OSError, ValueError, KeyError, TypeError) as error:
              print("Using the repository catalog", type(error).__name__)
          PY
      - uses: actions/cache/restore@v4
        with:
          path: source/data/radar
          key: radar-history-${{ github.run_id }}
          restore-keys: radar-history-
      - name: Record observed prices by size
        working-directory: source
        run: |
          if [ ! -d data/radar ] && [ -d ../published/radar ]; then cp -R ../published/radar data/radar; fi
          if [ "${{ github.event_name }}" = "push" ]; then python radar_data.py; else python collector.py --limit 0; fi
      - uses: actions/cache/save@v4
        with:
          path: source/data/radar
          key: radar-history-${{ github.run_id }}
      - name: Validate and export
        working-directory: source
        run: |
          python -m unittest test_collector test_site test_refresh_guard test_worker test_publish test_ghpages test_radar -q
          node test_selection.mjs
          node alerts/test.mjs
          python -c "import site_pages as s; d=s.catalog(); assert len(d['sources']) == 11 and any(s.fresh_offers(p,d) for p in d['products']), 'No fresh catalog to publish'"
          python export_ghpages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: source/data/github-export
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
